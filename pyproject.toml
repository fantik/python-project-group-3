[project]
name = "address-book-cli"
version = "0.1.0"
description = "CLI personal assistant for contact management and birthday tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6,<8.0",
]
docs = [
    "sphinx>=8.0,<9.0",
]

[tool.uv]
package = false

[tool.coverage.run]
source = [
    ".",
]
omit = [
    ".venv/*",
    "tests/*",
    "*/legacy_model_*.py",
]

[tool.coverage.report]
show_missing = true
omit = [
    ".venv/*",
    "tests/*",
    "*/legacy_model_*.py",
]
